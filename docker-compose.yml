services:
  postgres:
    image: postgres:16-alpine
    container_name: glot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: glot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: Comment out if using a cloud Redis provider (e.g., Upstash)
  redis:
    image: redis:7-alpine
    container_name: glot-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: Comment out if you don't need a database UI
  adminer:
    image: adminer:latest
    container_name: glot-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: glot-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Override for Docker networking
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/glot"
      DATABASE_URL_SYNC: "postgresql+psycopg2://postgres:postgres@postgres:5432/glot"
      # For local Redis: use the line below
      # REDIS_URL: "redis://redis:6379"
      # For cloud Redis (e.g., Upstash): set REDIS_URL in .env file
      CORS_ORIGINS: '["http://localhost:3000","http://frontend:3000"]'
    depends_on:
      postgres:
        condition: service_healthy
      # Uncomment redis dependency if using local Redis
      # redis:
      #   condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: glot-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      # Backend URL for server-side API calls in Docker
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

  # Optional: Comment out if you don't need PDF extraction
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: glot-worker
    restart: unless-stopped
    command: ["uv", "run", "arq", "app.workers.extraction_worker.WorkerSettings"]
    env_file:
      - ./backend/.env
    environment:
      # Override for Docker networking
      DATABASE_URL: "postgresql+asyncpg://postgres:postgres@postgres:5432/glot"
      DATABASE_URL_SYNC: "postgresql+psycopg2://postgres:postgres@postgres:5432/glot"
      # For local Redis: use the line below
      # REDIS_URL: "redis://redis:6379"
      # For cloud Redis (e.g., Upstash): set REDIS_URL in .env file
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
      # Uncomment redis dependency if using local Redis
      # redis:
      #   condition: service_healthy

volumes:
  postgres_data:
  redis_data:
