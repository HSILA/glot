[project]
name = "glot-backend"
version = "0.3.3"
description = "Glot - A personal spaced-repetition learning PWA backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "sqlmodel>=0.0.22",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "fsrs-rs-python>=0.8.2",
    "pydantic-settings>=2.7.0",
    "alembic>=1.14.0",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.3",
    "pyjwt>=2.10.1",
    "email-validator>=2.3.0",
    "slowapi>=0.1.9",
    "user-agents>=2.2.0",
    "argon2-cffi>=25.1.0",
    "bcrypt>=4.0.0",
    "boto3>=1.42.19",
    "arq>=0.26.3",
    "redis>=5.3.1",
    "smolagents[openai]>=1.23.0",
    "pymupdf>=1.26.7",
    "pillow>=12.0.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.1",
    "ruff>=0.8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.wheel.force-include]
"config/app.yaml" = "app/config/app.yaml"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ruff>=0.14.10",
]
