name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # PostgreSQL backs the integration tests in backend/tests/integration
    # (picked up via TEST_DATABASE_URL); migrations are smoke-checked too.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: glot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      JWT_SECRET: ci-test-jwt-secret
      R2_ACCOUNT_ID: test-account
      R2_ACCESS_KEY_ID: test-key
      R2_SECRET_ACCESS_KEY: test-secret
      R2_BUCKET_NAME: test-bucket
      OPENROUTER_API_KEY: test-openrouter-key
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/glot_test
      DATABASE_URL_SYNC: postgresql+psycopg2://postgres:postgres@localhost:5432/glot_test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.7"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: uv sync --locked --extra dev

      - name: Lint backend
        run: uv run --locked ruff check .

      - name: Check migrations apply cleanly
        run: |
          uv run --locked alembic upgrade head
          uv run --locked alembic downgrade -1
          uv run --locked alembic upgrade head

      - name: Test backend
        run: uv run --locked pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Lint frontend
        run: bun run lint

      - name: Test frontend
        run: bun test

      - name: Build frontend
        run: bun run build
