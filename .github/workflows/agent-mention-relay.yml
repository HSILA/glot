name: Agent Mention Relay

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  relay:
    runs-on: [self-hosted]
    timeout-minutes: 2

    if: >
      (
        contains(github.event.comment.body, '@hsilabot') ||
        contains(github.event.review.body, '@hsilabot')
      ) &&
      (
        contains(fromJSON('["HSILA","hsilabot"]'), github.event.comment.user.login) ||
        contains(fromJSON('["HSILA","hsilabot"]'), github.event.review.user.login)
      ) &&
      (
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) ||
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)
      ) &&
      github.actor != 'github-actions[bot]'

    steps:
      - name: Build payload
        env:
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          COMMENT_URL: ${{ github.event.comment.html_url || github.event.review.html_url }}
          AUTHOR: ${{ github.event.comment.user.login || github.event.review.user.login }}
          BODY: ${{ github.event.comment.body || github.event.review.body }}
          PR_TITLE: ${{ github.event.pull_request.title || github.event.issue.title }}
        run: |
          python3 - <<'PY'
          import json
          import os

          event_name = os.getenv("EVENT_NAME", "unknown")
          event_type = {
              "issue_comment": "PR Comment" if os.getenv("PR_NUMBER") else "Issue Comment",
              "pull_request_review_comment": "PR Review Comment (line-specific)",
              "pull_request_review": "PR Review Submitted",
          }.get(event_name, event_name)

          lines = [
              "🔔 **GitHub Mention**",
              "",
              f"**Type**: {event_type}",
              f"**Repo**: {os.getenv('REPO')}",
              f"**PR/Issue**: #{os.getenv('PR_NUMBER')} - {os.getenv('PR_TITLE')}",
              f"**Author**: @{os.getenv('AUTHOR')}",
              f"**URL**: {os.getenv('COMMENT_URL')}",
              "",
              "**Comment:**",
              os.getenv("BODY") or "(no content)",
              "",
              "---",
              "**Task:**",
              "1. Read and understand the user's request",
              "2. Take appropriate action (fix code, answer question, etc.)",
              "3. Reply in the same GitHub thread using: `gh pr comment` or `gh issue comment`",
              "4. Keep response concise and actionable",
              "",
              "**Important:** Respond immediately. Do not wait or batch.",
          ]

          payload = {
              "name": "GitHub",
              "agentId": "main",
              "wakeMode": "now",
              "deliver": False,
              "message": "\n".join(lines),
          }

          with open("payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f)

          print(f"Relaying {event_type} mention from @{os.getenv('AUTHOR')}")
          PY

      - name: Relay request
        env:
          AGENT_RELAY_URL: ${{ secrets.AGENT_RELAY_URL }}
          AGENT_RELAY_TOKEN: ${{ secrets.AGENT_RELAY_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST "$AGENT_RELAY_URL" \
            -H "Authorization: Bearer $AGENT_RELAY_TOKEN" \
            -H "Content-Type: application/json" \
            --data @payload.json
